permissions:
  contents: write
  packages: write
name: Release Pipeline

# Packaging & release pipeline, mirroring the org-standard pattern from
# DevelApp-ai/RuntimePluggableClassFactory (.github/workflows/dotnet-cicd.yml):
#
# - All three library projects are packed as NuGet packages:
#     DevelApp.PluginJobRunner.Interface  (PluginInterface)
#     DevelApp.PluginJobRunner.Model      (JobExecutorModel)
#     DevelApp.PluginJobRunner.Executors  (JobExecutor)
# - Versioning is GitVersion-driven (GitVersion.yml, ContinuousDeployment).
# - Pushes to main are SIGNED with Certum cloud code signing before
#   publishing (org decisions DevelApp-ai/DevelApp-Repo-Global#38 + #73):
#   'dotnet nuget sign --certificate-fingerprint <SHA-256 fingerprint>
#   --timestamper http://time.certum.pl' + 'dotnet nuget verify' gate.
#   PR-triggered builds skip signing so no TOTP window is spent on PRs.
# - Publish order: GitHub Packages (all versions) -> GitHub Release
#   (packages + self-contained JobRunner binaries) -> NuGet.org (stable
#   only, NUGET_API_KEY). A NuGet.org failure can never block the org
#   feed or the tagged release, but fails the job visibly.
# - JobRunner is an ASP.NET Core executable (Web SDK, never packed): it
#   ships as self-contained binaries on the GitHub Release and as a
#   container image on GHCR (ghcr.io/develapp-ai/pluginjobrunner), built
#   from the prebuilt publish layout so no feed credentials enter image
#   layers.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      nugetversion: ${{ steps.version.outputs.nugetversion }}
      isprerelease: ${{ steps.version.outputs.isprerelease }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0 # Fetches all history for GitVersion

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0.10.2
      with:
        versionSpec: '6.x'

    - name: Determine Version
      id: gitversion # The output of this step is used later
      uses: gittools/actions/gitversion/execute@v0.10.2
      continue-on-error: true

    - name: Set fallback version
      id: fallback-version
      if: failure()
      run: |
        echo "GitVersion failed, using fallback version"
        echo "semVer=1.0.0-fallback.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    # DevelApp.RuntimePluggableClassFactory >= 2.1.1 is published to the org's GitHub
    # Packages feed (not NuGet.org); authenticate the feed so restore can resolve it.
    - name: Configure GitHub Packages feed
      run: dotnet nuget add source --username ${{ github.actor }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github-packages https://nuget.pkg.github.com/DevelApp-ai/index.json

    - name: Restore dependencies
      run: dotnet restore PluginJobRunner.sln

    - name: Set version variables
      id: version
      run: |
        if [ "${{ steps.gitversion.outcome }}" == "success" ]; then
          echo "semver=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "nugetversion=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "Using GitVersion: ${{ steps.gitversion.outputs.semVer }}"
          if [[ "${{ steps.gitversion.outputs.semVer }}" == *-* ]]; then
            echo "isprerelease=true" >> $GITHUB_OUTPUT
          else
            echo "isprerelease=false" >> $GITHUB_OUTPUT
          fi
        else
          echo "semver=${{ steps.fallback-version.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "nugetversion=${{ steps.fallback-version.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "isprerelease=true" >> $GITHUB_OUTPUT
          echo "Using fallback version: ${{ steps.fallback-version.outputs.semVer }}"
        fi

    - name: Build solution
      run: dotnet build PluginJobRunner.sln --configuration Release --no-restore /p:Version=${{ steps.version.outputs.semver }}

    - name: Run tests
      run: dotnet test PluginJobRunner.sln --configuration Release --no-build --nologo

    - name: Pack NuGet packages
      run: |
        dotnet pack PluginInterface/PluginInterface.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.nugetversion }}
        dotnet pack JobExecutorModel/JobExecutorModel.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.nugetversion }}
        dotnet pack JobExecutor/JobExecutor.csproj --no-build --configuration Release -o ./artifacts /p:PackageVersion=${{ steps.version.outputs.nugetversion }}

    - name: Publish JobRunner executables and plugin folder
      run: |
        # Self-contained JobRunner binaries; the JobExecutor plugin
        # assemblies are published into Plugins/ next to the host so the
        # FilePluginLoader finds them (PluginDirectory: Plugins).
        dotnet publish JobRunner/JobRunner.csproj --configuration Release --no-restore --self-contained -r win-x64 -o ./publish/win-x64
        dotnet publish JobExecutor/JobExecutor.csproj --configuration Release --no-restore -o ./publish/win-x64/Plugins
        dotnet publish JobRunner/JobRunner.csproj --configuration Release --no-restore --self-contained -r linux-x64 -o ./publish/linux-x64
        dotnet publish JobExecutor/JobExecutor.csproj --configuration Release --no-restore -o ./publish/linux-x64/Plugins
        # Framework-dependent layout for the GHCR container image
        dotnet publish JobRunner/JobRunner.csproj --configuration Release --no-restore -o ./publish/container
        dotnet publish JobExecutor/JobExecutor.csproj --configuration Release --no-restore -o ./publish/container/Plugins
        cd publish
        zip -rq ../JobRunner-v${{ steps.version.outputs.semver }}-win-x64.zip win-x64
        tar -czf ../JobRunner-v${{ steps.version.outputs.semver }}-linux-x64.tar.gz linux-x64
        cd ..

    - name: Upload NuGet artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts/*.nupkg

    - name: Upload executable artifacts
      uses: actions/upload-artifact@v6
      with:
        name: jobrunner-binaries
        path: |
          ./JobRunner-v*.zip
          ./JobRunner-v*.tar.gz

    - name: Upload container layout
      uses: actions/upload-artifact@v6
      with:
        name: jobrunner-container
        path: ./publish/container/

  sign:
    # Branch pushes only (org decisions #38 + #73): every push to main is
    # signed (stable and prerelease); PR-triggered builds skip signing so
    # no TOTP window is spent on PR builds.
    needs: build
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
    # No SDK pin (decision #73 amendment): the SHA-256 fingerprint
    # interface works identically on the runner's newest SDK.
    - name: Download artifacts
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Validate signing inputs
      # Fail fast BEFORE the SimplySign login consumes a TOTP window
      # (values are never echoed).
      shell: pwsh
      env:
        CERTUM_SIMPLYSIGN_USERID: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        CERTUM_SIMPLYSIGN_OTP_URI: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        CERTUM_THUMBPRINT: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        foreach ($name in @('CERTUM_SIMPLYSIGN_USERID','CERTUM_SIMPLYSIGN_OTP_URI','CERTUM_THUMBPRINT','CERTUM_FINGERPRINT_SHA256')) {
          if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
            throw "Missing signing input: $name (org secrets setup, decision #38)"
          }
        }
        $tp = $env:CERTUM_THUMBPRINT -replace '\s',''
        if ($tp -notmatch '^[0-9A-Fa-f]{40}$') { throw 'Certificate thumbprint must be exactly 40 hex characters (CODE_SIGNING_CERT_THUMBPRINT org secret).' }
        $fp = $env:CERTUM_FINGERPRINT_SHA256 -replace '\s',''
        if ($fp -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Certificate fingerprint must be exactly 64 hex characters (CODE_SIGNING_CERT_FINGERPRINT_SHA256 org secret, decision #73 amendment).' }
        $uri = $null
        if (-not [Uri]::TryCreate($env:CERTUM_SIMPLYSIGN_OTP_URI, [UriKind]::Absolute, [ref]$uri) -or
            $uri.Scheme -ne 'otpauth' -or $uri.Host -ne 'totp' -or
            $uri.Query -notmatch '[?&]secret=[A-Za-z2-7]+=*(&|$)') {
          throw 'CERTUM_SIMPLYSIGN_OTP_URI must be the full otpauth://totp provisioning URI (org secrets setup, decision #38).'
        }

    - name: Connect to Certum SimplySign
      # Pinned by full commit SHA; same pin as RuntimePluggableClassFactory
      # (org decision #38). Never sees CERTUM_SIMPLYSIGN_PASSWORD.
      uses: dismine/windows-app-signing-setup-action@89ae3b032d4bc7a5b98d1a42a34e61ecb6faad64
      with:
        certum-username: ${{ secrets.CERTUM_SIMPLYSIGN_USERID }}
        certum-otp-uri: ${{ secrets.CERTUM_SIMPLYSIGN_OTP_URI }}
        certum-key-id: ${{ secrets.CODE_SIGNING_CERT_THUMBPRINT }}
        capture-diagnostics: 'false'

    - name: Sign NuGet packages
      # '--certificate-fingerprint' is the only valid certificate-store
      # lookup option here (decision #73 amendment). Looks up
      # CurrentUser\My, where the SimplySign action installs the cloud
      # certificate.
      shell: pwsh
      env:
        CERTUM_FINGERPRINT_SHA256: ${{ secrets.CODE_SIGNING_CERT_FINGERPRINT_SHA256 }}
      run: |
        $fp = ($env:CERTUM_FINGERPRINT_SHA256 -replace '\s','').ToUpperInvariant()
        $packages = @(Get-ChildItem ./artifacts/*.nupkg)
        if (-not $packages.Count) { throw 'No packages found to sign.' }
        foreach ($p in $packages) {
          dotnet nuget sign $p.FullName --certificate-fingerprint $fp --timestamper http://time.certum.pl
          if ($LASTEXITCODE -ne 0) { throw "Signing failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Verify signatures (gate)
      # Any invalid signature fails the job and blocks publishing.
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem ./artifacts/*.nupkg)
        foreach ($p in $packages) {
          dotnet nuget verify $p.FullName
          if ($LASTEXITCODE -ne 0) { throw "Signature verification failed (exit $LASTEXITCODE): $($p.Name)" }
        }

    - name: Upload signed artifacts
      uses: actions/upload-artifact@v6
      with:
        name: nuget-packages-signed
        path: ./artifacts/*.nupkg

  publish:
    # Publishing and the GitHub Release depend on sign: every push to
    # main publishes the SIGNED packages (stable and prerelease; org
    # decisions #38 + #73). The unsigned download path remains only as a
    # fallback for runs where signing was skipped. A sign FAILURE blocks
    # publishing.
    needs: [build, sign]
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'push' && (needs.sign.result == 'success' || needs.sign.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - name: Download signed artifacts
      if: needs.sign.result == 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages-signed
        path: ./artifacts

    - name: Download artifacts (fallback, unsigned)
      if: needs.sign.result != 'success'
      uses: actions/download-artifact@v6
      with:
        name: nuget-packages
        path: ./artifacts

    - name: Download executable artifacts
      uses: actions/download-artifact@v6
      with:
        name: jobrunner-binaries
        path: ./binaries

    - name: Publish to GitHub Packages
      # Publishes ALL versions (prerelease and stable) to GitHub
      # Packages. Runs FIRST and is not affected by any NuGet.org
      # problems (org decision #73).
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/DevelApp-ai/index.json --skip-duplicate

    - name: Create GitHub Release
      # Runs BEFORE the NuGet.org push (org feed first, release second,
      # NuGet.org last) so a NuGet.org failure can never block the org
      # feed or the tagged release. Attaches the packages and the
      # self-contained JobRunner binaries.
      uses: softprops/action-gh-release@v3
      with:
        tag_name: v${{ needs.build.outputs.semver }}
        name: Release v${{ needs.build.outputs.semver }}
        body: |
          ## 📦 NuGet Packages

          Published to GitHub Packages:
          - DevelApp.PluginJobRunner.Interface v${{ needs.build.outputs.semver }}
          - DevelApp.PluginJobRunner.Model v${{ needs.build.outputs.semver }}
          - DevelApp.PluginJobRunner.Executors v${{ needs.build.outputs.semver }}

          Stable releases are also published to NuGet.org.

          ## 🖥️ JobRunner Executable

          Self-contained binaries with the sample plugins pre-deployed into Plugins/:
          - JobRunner-v${{ needs.build.outputs.semver }}-win-x64.zip
          - JobRunner-v${{ needs.build.outputs.semver }}-linux-x64.tar.gz

          Container image: ghcr.io/develapp-ai/pluginjobrunner:v${{ needs.build.outputs.semver }}
        draft: false
        prerelease: ${{ needs.build.outputs.isprerelease == 'true' }}
        files: |
          ./artifacts/*.nupkg
          ./binaries/*

    - name: Publish to NuGet.org
      # Only stable (non-prerelease) versions are published to NuGet.org.
      # Last step on purpose: a failure here must never block GitHub
      # Packages publishing or the tagged release (both already done),
      # but it FAILS THE JOB visibly — no continue-on-error (the silent
      # swallow is what hid missing NUGET_API_KEY elsewhere in the org).
      if: github.event_name == 'push' && needs.build.outputs.isprerelease == 'false'
      run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  publish-container:
    # JobRunner container image on GHCR (org container home precedent:
    # RuntimePluggableClassFactory issue #36). Built from the prebuilt
    # framework-dependent publish layout so no GitHub Packages
    # credentials ever enter an image layer.
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download container layout
      uses: actions/download-artifact@v6
      with:
        name: jobrunner-container
        path: ./publish/container

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Compute image tags
      id: tags
      run: |
        tags="ghcr.io/develapp-ai/pluginjobrunner:v${{ needs.build.outputs.semver }}"
        if [ "${{ needs.build.outputs.isprerelease }}" != "true" ]; then
          tags="$tags,ghcr.io/develapp-ai/pluginjobrunner:latest"
        fi
        echo "tags=$tags" >> $GITHUB_OUTPUT

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.tags.outputs.tags }}
